spring.application.name=reservas
# En Render el puerto llega en la variable PORT; en local se usa 8083
server.port=${PORT:8083}

# UNA sola base de datos para todo el proyecto; cada microservicio usa su propio esquema
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas_lab}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
# Conexiones simultáneas a la base (Neon gratis admite ~100; 3 servicios x 10 = 30)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=reservas
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false

# Otros microservicios
usuarios.service.url=${USUARIOS_URL:http://localhost:8080}
notificaciones.service.url=${NOTIFICACIONES_URL:http://localhost:8084}

# API externa 1: festivos (Nager.Date, gratis y sin clave)
festivos.api.url=${FESTIVOS_API_URL:https://date.nager.at}
festivos.api.pais=CO
