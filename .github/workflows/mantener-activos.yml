# Mantiene despiertos los 3 microservicios del plan gratis de Render en horario laboral.
# Render duerme un servicio tras 15 min sin tráfico; aquí se hace ping cada 10 min.
#
# Horario: lunes a viernes, 08:00–16:00 hora Colombia (13:00–21:00 UTC).
# Consumo aprox.: 3 servicios × ~8,3 h × 22 días ≈ 550 h de las 750 h gratis al mes.
# Fuera del horario duermen y despiertan con la primera visita (puede tardar ~1 min).
#
# Para una demo fuera de horario: GitHub → Actions → "Mantener servicios activos" → Run workflow.
name: Mantener servicios activos

on:
  schedule:
    - cron: "*/10 13-20 * * 1-5"   # GitHub usa UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        servicio: [usuarios, reservas, notificaciones]
    steps:
      - name: Ping a ${{ matrix.servicio }}
        run: |
          url="https://reservaslab-${{ matrix.servicio }}-qw7i.onrender.com/api/ping"
          # Si estaba dormido, el primer intento puede tardar hasta ~60 s
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors "$url"
          echo
