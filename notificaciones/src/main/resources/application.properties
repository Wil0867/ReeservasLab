spring.application.name=notificaciones
# En Render el puerto llega en la variable PORT; en local se usa 8084
server.port=${PORT:8084}

# UNA sola base de datos para todo el proyecto; cada microservicio usa su propio esquema
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas_lab}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=notificaciones
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false

# Otros microservicios
usuarios.service.url=${USUARIOS_URL:http://localhost:8080}

# API externa 2: correo transaccional (Brevo)
brevo.api.url=https://api.brevo.com
brevo.api.key=${BREVO_API_KEY:sin-clave}
brevo.remitente.correo=${BREVO_REMITENTE:sin-remitente@correo.com}
brevo.remitente.nombre=LabReservas
